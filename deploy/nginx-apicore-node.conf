# Reverse proxy de nginx hacia el backend Node.js de ApiCore
# (node/server.js, escuchando en 127.0.0.1:8787 vía systemd, ver
# deploy/apicore-node.service). Compatible con nginx 1.18.
#
# A diferencia de deploy/nginx-apicore.conf (para el backend
# PowerShell), acá NO hace falta fijar el header Host: el server HTTP nativo
# de Node matchea la conexión por socket, no por Host header, así que el
# $host público se puede reenviar tal cual sin romper nada.
#
# Instalación:
#   Debian/Ubuntu, o un RHEL/CentOS/Rocky/Alma donde se arma a mano el patrón
#   sites-available/sites-enabled (ver "Instalación en Linux" en el README):
#     cp deploy/nginx-apicore-node.conf /etc/nginx/sites-available/apicore.conf
#     ln -s /etc/nginx/sites-available/apicore.conf /etc/nginx/sites-enabled/
#   RHEL/CentOS/Rocky/Alma con el conf.d/ stock (sin sites-available/enabled):
#     cp deploy/nginx-apicore-node.conf /etc/nginx/conf.d/apicore.conf
#   En ambos casos:
#     mkdir -p /var/www/apicore.voii.com.ar/public_html
#     cp -r /opt/apicore/wwwroot/. /var/www/apicore.voii.com.ar/public_html/
#     nginx -t && systemctl reload nginx
#
# Ajustar server_name, root, puerto/certificado según el servidor — ver las
# variantes comentadas más abajo (sin TLS, o HTTPS 443 con Let's Encrypt) si
# no aplica la de 8788 + wildcard.
#
# RHEL/CentOS/Rocky/Alma con SELinux en Enforcing (default): sin este paso
# nginx devuelve 502 Bad Gateway al hacer proxy_pass a 127.0.0.1:8787, aunque
# el backend esté corriendo bien —
#   setsebool -P httpd_can_network_connect 1
# y firewalld también bloquea los puertos entrantes por default — para 80/443:
#   firewall-cmd --permanent --add-service=http && firewall-cmd --reload
# para un puerto no estándar como 8788 (y SELinux también lo bloquea si no es
# uno de los puertos ya catalogados como http_port_t):
#   firewall-cmd --permanent --add-port=8788/tcp && firewall-cmd --reload
#   semanage port -a -t http_port_t -p tcp 8788   # (semanage: paquete policycoreutils-python-utils)

# Este server{} es el que corre en producción: HTTPS en el puerto 8788 (no el
# 443 estándar — elegido a propósito en este servidor, no es un placeholder)
# con el certificado wildcard que ya usan otros sitios de este mismo host
# (no Let's Encrypt). La contraseña de AD viaja en el body de POST
# /api/login: sin TLS acá, viaja en texto plano entre el navegador y nginx —
# por eso este server{} es el "real", no un bloque HTTP sin cifrar.
server {
    listen 8788 ssl;
    listen [::]:8788 ssl;
    server_name apicore.voii.com.ar;  # <-- ajustar

    ssl_certificate     /etc/nginx/certificado/wildcard.crt;
    ssl_certificate_key /etc/nginx/certificado/wildcard.rsa;

    # nginx sirve wwwroot/ directo desde disco (convención de este servidor:
    # un docroot propio por sitio en /var/www/<dominio>/public_html, en vez
    # de dejar que el backend lo sirva él mismo) — hay que copiar el
    # contenido de wwwroot/ acá cada vez que cambie (deploy/app.js,
    # index.html, etc.), no es automático:
    #   cp -r /opt/apicore/wwwroot/. /var/www/apicore.voii.com.ar/public_html/
    # El backend (server.js) también sabe servir wwwroot/ por su cuenta
    # (serveStatic) si se prefiere simplificar y proxyear todo en vez de
    # mantener esta copia sincronizada — en ese caso, "root"/"index"/el
    # segundo "location" de acá no hacen falta: alcanza con un solo
    # "location / { proxy_pass ...; }" como el de más abajo, apuntando a "/"
    # en vez de "/api/".
    root /var/www/apicore.voii.com.ar/public_html;
    index index.html;

    # IMPORTANTE: db.local.json (raíz del repo, /opt/apicore/db.local.json)
    # NUNCA tiene que terminar dentro de wwwroot/ ni copiarse acá — tiene la
    # contraseña de MariaDB y la encryptionKey que cifra los secretos
    # guardados en la base (Sybase, client secrets OAuth2, etc.) en texto
    # plano. Si alguna vez un "cp -r wwwroot/." lo arrastra sin querer
    # (porque alguien lo dejó mal puesto dentro de wwwroot/ por error),
    # queda bajo este "root" y cualquiera lo descarga pidiendo
    # https://.../db.local.json directo. Antes de cada copia, confirmar que
    # /opt/apicore/wwwroot/ no tiene ningún archivo que no sea
    # app.js/index.html/styles.css (y similares) — nada de *.json de
    # configuración.
    location = /db.local.json {
        deny all;
    }

    # El CSV se parsea en el navegador, pero el body de /api/save-output puede
    # llevar el CSV de salida completo como JSON — 1m (default de nginx)
    # puede quedarse corto con archivos grandes.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El servidor Node atiende requests de a una por conexión entrante,
        # pero no está pensado para muchos usuarios concurrentes ejecutando
        # flows largos al mismo tiempo — timeout generoso por las dudas.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Todo lo que no sea /api/* es un archivo estático de wwwroot/ (index.html,
    # app.js, etc.) — nunca una ruta de servidor en el sentido de "carpeta con
    # index" (no hay subcarpetas navegables), así que 404 directo si no
    # existe el archivo, nada de redirigir a "/".
    location / {
        try_files $uri =404;
    }
}

