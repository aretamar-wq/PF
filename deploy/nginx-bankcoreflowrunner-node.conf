# Reverse proxy de nginx hacia el backend Node.js de BankCoreFlowRunner
# (node/server.js, escuchando en 127.0.0.1:8787 vía systemd, ver
# deploy/bankcoreflowrunner-node.service). Compatible con nginx 1.18.
#
# A diferencia de deploy/nginx-bankcoreflowrunner.conf (para el backend
# PowerShell), acá NO hace falta fijar el header Host: el server HTTP nativo
# de Node matchea la conexión por socket, no por Host header, así que el
# $host público se puede reenviar tal cual sin romper nada.
#
# Instalación:
#   Debian/Ubuntu:
#     cp deploy/nginx-bankcoreflowrunner-node.conf /etc/nginx/sites-available/bankcoreflowrunner.conf
#     ln -s /etc/nginx/sites-available/bankcoreflowrunner.conf /etc/nginx/sites-enabled/
#   RHEL/CentOS/Rocky/Alma (no traen sites-available/sites-enabled):
#     cp deploy/nginx-bankcoreflowrunner-node.conf /etc/nginx/conf.d/bankcoreflowrunner.conf
#   En ambos casos:
#     nginx -t && systemctl reload nginx
#
# Ajustar server_name y, si aplica, agregar el bloque HTTPS de más abajo.
#
# RHEL/CentOS/Rocky/Alma con SELinux en Enforcing (default): sin este paso
# nginx devuelve 502 Bad Gateway al hacer proxy_pass a 127.0.0.1:8787, aunque
# el backend esté corriendo bien —
#   setsebool -P httpd_can_network_connect 1
# y firewalld también bloquea 80/443 entrantes por default —
#   firewall-cmd --permanent --add-service=http && firewall-cmd --reload

server {
    listen 80;
    listen [::]:80;
    server_name bankcoreflowrunner.voii.com.ar;  # <-- ajustar

    # El CSV se parsea en el navegador, pero el body de /api/save-output puede
    # llevar el CSV de salida completo como JSON — 1m (default de nginx)
    # puede quedarse corto con archivos grandes.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El servidor Node atiende requests de a una por conexión entrante,
        # pero no está pensado para muchos usuarios concurrentes ejecutando
        # flows largos al mismo tiempo — timeout generoso por las dudas.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

