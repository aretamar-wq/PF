# Reverse proxy de nginx hacia BankCoreFlowRunner (server.ps1, escuchando en
# 127.0.0.1:8787 vía systemd, ver deploy/bankcoreflowrunner.service).
# Compatible con nginx 1.18 — no usa ninguna directiva de versiones más nuevas.
#
# Instalación:
#   Debian/Ubuntu:
#     cp deploy/nginx-bankcoreflowrunner.conf /etc/nginx/sites-available/bankcoreflowrunner.conf
#     ln -s /etc/nginx/sites-available/bankcoreflowrunner.conf /etc/nginx/sites-enabled/
#   RHEL/CentOS/Rocky/Alma (no traen sites-available/sites-enabled):
#     cp deploy/nginx-bankcoreflowrunner.conf /etc/nginx/conf.d/bankcoreflowrunner.conf
#   En ambos casos:
#     nginx -t && systemctl reload nginx
#
# Ajustar server_name y, si aplica, agregar el bloque HTTPS de más abajo.
#
# RHEL/CentOS/Rocky/Alma con SELinux en Enforcing (default): sin este paso
# nginx devuelve 502 Bad Gateway al hacer proxy_pass a 127.0.0.1:8787, aunque
# el backend esté corriendo bien —
#   setsebool -P httpd_can_network_connect 1
# y para exponerlo fuera del propio servidor, firewalld también bloquea
# 80/443 por default —
#   firewall-cmd --permanent --add-service=http && firewall-cmd --reload

server {
    listen 80;
    listen [::]:80;
    server_name bankcoreflowrunner.voii.com.ar;  # <-- ajustar

    # El CSV se parsea en el navegador (no se sube el archivo entero al
    # servidor), pero el body de /api/save-output puede llevar el CSV de
    # salida completo como JSON — 1m (default de nginx) puede quedarse corto
    # con archivos grandes.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # OJO: hardcodeado a "localhost:8787", NO $host. server.ps1 registra su
        # HttpListener con el prefijo "http://localhost:8787/" (para poder
        # levantar sin admin en Windows: un prefijo "+"/"*" sí lo requiere) — y
        # HttpListener matchea requests por Header Host contra ese prefijo, no
        # por a qué socket llegaron. Si acá se manda el Host público real
        # (bankcoreflowrunner.voii.com.ar), HttpListener no lo reconoce y
        # devuelve 404 para todo, aunque nginx sí haya conectado bien al
        # backend. La app no usa el Host header para nada más (no arma URLs
        # absolutas ni valida Origin), así que pisarlo acá no tiene efecto
        # colateral. Si cambiás -Port en el systemd unit, actualizá el puerto
        # también en esta línea.
        proxy_set_header Host localhost:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # server.ps1 atiende un request HTTP a la vez (HttpListener sincrónico,
        # ver "Limitaciones conocidas" en el README) — si un flow tarda en
        # correr, el siguiente usuario queda esperando detrás; por eso el
        # timeout generoso en vez del default de 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

