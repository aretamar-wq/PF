name: Build portable exe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/windows-portable-banking-api-bxof8z
      - main
    paths:
      - "src/BankCoreFlowRunner/**"
      - ".github/workflows/build-portable.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/BankCoreFlowRunner/BankCoreFlowRunner.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: BankCoreFlowRunner-portable
          path: publish/
          if-no-files-found: error
